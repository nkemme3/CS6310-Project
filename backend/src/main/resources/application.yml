server:
  port: 8080

spring:
  application:
    name: powergrid
  jackson:
    serialization:
      write-dates-as-timestamps: false

powergrid:
  robustness:
    data-dir: ./data
    checkpoint-interval-ms: 60000
  distances:
    max-plant-substation: 50
    max-substation-transformer: 25
    max-transformer-customer: 10
  auth:
    admin-username: admin
    admin-password: admin123
    session-ttl-hours: 12

logging:
  level:
    edu.gatech.cs6310.powergrid: INFO
